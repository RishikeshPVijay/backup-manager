name: Build and audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python tools/validate_handoff.py
      - run: |
          epoch=$(git show -s --format=%ct HEAD)
          python tools/build_release.py --output dist --epoch "$epoch"
          python tools/build_release.py --output dist-repeat --epoch "$epoch"
          diff -r dist dist-repeat
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m pip check
      - run: python -m unittest discover -s tests/unit -v
      - run: backup-manager --json version
      - run: sha256sum requirements-dev.lock dist/* > build-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-python-${{ matrix.python }}
          path: |
            build-sha256.txt
            dist/
          if-no-files-found: error
  dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pip-audit==2.10.0
      - run: python -m pip_audit --no-deps --disable-pip -r requirements-dev.lock --format json --output dependency-audit.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-python-${{ matrix.python }}
          path: dependency-audit.json
          if-no-files-found: error
