name: Linux safety regressions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.lock
      - run: python tools/validate_handoff.py
      - run: python -m build --no-isolation
      - id: wheel
        run: python -m pip install --no-deps dist/*.whl
      - name: Prepare certified Restic and user scopes
        shell: bash
        run: bash tools/prepare_hosted_acceptance.sh x86_64 2>&1 | tee hosted-preflight.log
      - run: python tools/certify_restic.py --report restic-certification.json
      - run: python tools/run_linux_regressions.py scoped --output scoped-results
      - if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        name: Test disposable mount namespaces
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # Map the checkout owner to root inside each fixture's user namespace.
          # Ubuntu may restrict namespace capabilities even when unshare succeeds.
          setting=kernel.apparmor_restrict_unprivileged_userns
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            original=$(sudo -n sysctl -n "$setting")
            if [[ "$original" != 0 ]]; then
              trap 'sudo -n sysctl -w "$setting=$original"' EXIT
              sudo -n sysctl -w "$setting=0"
            fi
          fi
          python tools/run_linux_regressions.py namespace --output namespace-results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-regression-results
          path: |
            hosted-preflight.log
            restic-certification.json
            scoped-results/
            namespace-results/
          if-no-files-found: error
  loop:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test ext4 acquisition, release and external preservation
        shell: bash
        run: |
          {
            test "$RUNNER_ENVIRONMENT" = github-hosted
            if [[ ! -d /sys/module/loop ]]; then
              sudo -n modprobe loop
            fi
            sudo -n unshare --mount --propagation private bash -euo pipefail -c '
              mount -t tmpfs -o mode=0755,dev,nosuid tmpfs /dev
              mknod -m 666 /dev/null c 1 3
              mknod -m 666 /dev/urandom c 1 9
              mknod -m 600 /dev/loop-control c 10 237
              export BACKUP_MANAGER_DISPOSABLE_LOOP_FIXTURE=1
              export PYTHONPATH="$1/src" PYTHONDONTWRITEBYTECODE=1
              exec /usr/bin/python3 "$1/tests/experiments/linux_loop_lifecycle.py"
            ' bash "$GITHUB_WORKSPACE"
          } 2>&1 | tee loop-lifecycle.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-device-regression
          path: loop-lifecycle.log
          if-no-files-found: error
  acceptance:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_arch: x64
            machine: x86_64
            image: ubuntu-24.04
          - runner_arch: arm64
            machine: aarch64
            image: ubuntu-24.04-arm
    runs-on: ${{ matrix.image }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare certified Restic and user scopes
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          evidence="$RUNNER_TEMP/backup-manager-i9-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 0700 "$evidence"
          printf 'EVIDENCE_DIR=%s\n' "$evidence" >> "$GITHUB_ENV"
          bash tools/prepare_hosted_acceptance.sh "$EXPECTED_MACHINE" 2>&1 | tee "$evidence/hosted-preflight.log"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.lock
      - run: python tools/validate_handoff.py
      - run: python -m build --no-isolation
      - run: python -m pip install --no-deps dist/*.whl
      - run: python tools/run_acceptance.py --output "$EVIDENCE_DIR/acceptance"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-evidence-${{ matrix.runner_arch }}
          path: ${{ runner.temp }}/backup-manager-i9-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
