[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "backup-manager"
version = "0.1.0"
description = "Local Restic backup orchestration"
requires-python = ">=3.12,<3.14"
dependencies = ["jsonschema>=4.26,<5"]

[project.scripts]
backup-manager = "backup_manager.cli:main"

[tool.setuptools]
packages = ["backup_manager", "backup_manager.schemas", "backup_manager.migrations"]

[tool.setuptools.package-dir]
backup_manager = "src/backup_manager"
"backup_manager.schemas" = "schemas"

[tool.setuptools.package-data]
"backup_manager.schemas" = ["*.json"]
"backup_manager.migrations" = ["*.sql"]
